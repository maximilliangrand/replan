name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: replan
          POSTGRES_PASSWORD: replan-ci
          POSTGRES_DB: replan_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U replan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://replan:replan-ci@127.0.0.1:5432/replan_test
      TEST_INVENTORY_DATABASE_URL: postgres://replan:replan-ci@127.0.0.1:5432/replan_inventory_test
      TEST_CARRIER_DATABASE_URL: postgres://replan:replan-ci@127.0.0.1:5432/replan_carrier_test
      PGPASSWORD: replan-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.6'
          python-version: '3.12'
      - run: npm ci
      - run: uv sync --frozen --project solver
      - run: uv run --frozen --project solver python -c 'from ortools.sat.python import cp_model'
      - run: createdb -h 127.0.0.1 -U replan replan_inventory_test
      - run: createdb -h 127.0.0.1 -U replan replan_carrier_test
      - run: npm run build
      - run: npm run format:check
      - run: npm test
      - run: npm run test:solver
      - run: npm run evaluate
      - run: npm audit --audit-level=high
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose up --build -d --wait
      - run: node scripts/smoke.mjs http://127.0.0.1:4310
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
