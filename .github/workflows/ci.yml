name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-and-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: replan
          POSTGRES_PASSWORD: replan-ci
          POSTGRES_DB: replan_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U replan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://replan:replan-ci@127.0.0.1:5432/replan_test
      TEST_INVENTORY_DATABASE_URL: postgres://replan:replan-ci@127.0.0.1:5432/replan_inventory_test
      TEST_CARRIER_DATABASE_URL: postgres://replan:replan-ci@127.0.0.1:5432/replan_carrier_test
      TEST_AUTH_DATABASE_URL: postgres://replan:replan-ci@127.0.0.1:5432/replan_auth_test
      TEST_PILOT_DATABASE_URL: postgres://replan:replan-ci@127.0.0.1:5432/replan_pilot_test
      BACKUP_ADMIN_DATABASE_URL: postgres://replan:replan-ci@127.0.0.1:5432/replan_test
      PGPASSWORD: replan-ci
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.10.6'
          python-version: '3.12'
      - run: npm ci
      - run: uv sync --frozen --project solver
      - run: uv run --frozen --project solver python -c 'from ortools.sat.python import cp_model'
      - run: createdb -h 127.0.0.1 -U replan replan_inventory_test
      - run: createdb -h 127.0.0.1 -U replan replan_carrier_test
      - run: createdb -h 127.0.0.1 -U replan replan_auth_test
      - run: createdb -h 127.0.0.1 -U replan replan_pilot_test
      - run: npm run build
      - run: npm run format:check
      - run: npm test
      - name: Install HTTPS browser acceptance tools
        run: |
          npx playwright install --with-deps chromium
          curl --fail --silent --show-error --location https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz --output /tmp/caddy.tar.gz
          echo '527fbf917c39189a1e3b31d34fa955601680b2d5c8055d2a87b8b9588dec7bb9  /tmp/caddy.tar.gz' | sha256sum --check
          mkdir -p .local/validation/caddy
          tar -xzf /tmp/caddy.tar.gz -C .local/validation/caddy caddy
      - run: npm run test:browser
      - run: npm run test:capacity
      - run: npm run backup:drill
      - run: npm run test:solver
      - run: npm run evaluate
      - run: npm audit --audit-level=high
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose up --build -d --wait
      - run: node scripts/smoke.mjs http://127.0.0.1:4310
      - name: Validate private pilot deployment configuration
        env:
          APP_DOMAIN: pilot.example.com
          APP_ORIGIN: https://pilot.example.com
          ACME_EMAIL: ci@example.com
          PILOT_ALLOWED_CIDRS: 192.0.2.1/32
          DATABASE_URL: postgres://runtime:unused@database/replan
          MIGRATION_DATABASE_URL: postgres://owner:unused@database/replan
          INVENTORY_URL: http://inventory:4311
          CARRIER_URL: http://carrier:4312
          INVENTORY_DATABASE_URL: postgres://inventory:unused@database/inventory
          CARRIER_DATABASE_URL: postgres://carrier:unused@database/carrier
          PROVIDER_TOKEN: ci-only-placeholder-not-a-deployed-secret
        run: |
          docker compose -f compose.pilot.yaml --profile simulation config --quiet
          docker run --rm -e APP_DOMAIN -e ACME_EMAIL -e PILOT_ALLOWED_CIDRS -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify solver in the read-only pilot container configuration
        run: |
          REPLAN_TEST_IMAGE=$(docker compose images -q replan)
          docker run --rm --read-only --tmpfs /tmp -e UV_NO_SYNC=1 -e UV_CACHE_DIR=/tmp/uv -e PYTHONDONTWRITEBYTECODE=1 "$REPLAN_TEST_IMAGE" uv run --frozen --project solver python -c 'from ortools.sat.python import cp_model; m=cp_model.CpModel(); m.new_bool_var("ready"); assert cp_model.CpSolver().solve(m)==cp_model.OPTIMAL'
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
